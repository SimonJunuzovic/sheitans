<style>
  :root{
    --bg:#1c1c1e;
    --line:rgba(255,255,255,.22);
    --text:#f2f2f2;
    --red:#e1121b;
    --speed:70s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:200;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(56px,12vh,128px);
    overflow-x:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .logo{
    width:min(860px,78vw);max-height:42svh;object-fit:contain;height:auto;display:block;
    position:relative;z-index:1;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.55));
    user-select:none;-webkit-user-drag:none;
  }
  .band{
    width:100%;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:clamp(14px,2.6vh,22px) 0;
    overflow:visible;
    position:relative;z-index:2;
  }
  .track{
    display:flex;width:max-content;
    -webkit-animation:scroll var(--speed) linear infinite;
    animation:scroll var(--speed) linear infinite;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
  }
  
  @-webkit-keyframes scroll{from{-webkit-transform:translate3d(-50%,0,0)}to{-webkit-transform:translate3d(0,0,0)}}
  @keyframes scroll{from{transform:translate3d(-50%,0,0)}to{transform:translate3d(0,0,0)}}
  .item{
    display:inline-flex;align-items:center;white-space:nowrap;
    font-size:clamp(14px,2.8vw,28px);
    letter-spacing:.14em;font-weight:200;text-transform:uppercase;
    padding-right:.9em;cursor:default;
  }
  .item::after{content:"✦";font-size:.45em;margin-left:.9em;opacity:.6}
  .w{display:inline-block;position:relative}
  .w + .w{margin-left:.35em}
  .l{display:inline-block}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .item.hide .w,.item.hide::after{visibility:hidden}
  .fire{
    position:fixed;top:0;bottom:auto;
    width:clamp(70px,16vw,260px);
    height:100vh;height:100lvh;          /* large viewport: runs behind Safari's toolbar */
    pointer-events:none;z-index:0;
    -webkit-mask-image:linear-gradient(to right,#000 45%,transparent 98%);
    mask-image:linear-gradient(to right,#000 45%,transparent 98%);
  }
  .fire.left{left:0}
  .fire.right{right:0;transform:scaleX(-1)}
  @media (prefers-reduced-motion:reduce){
    .track{animation-duration:80s}
  }
</style>
</head>

  <div class="band" aria-label="New season 2027 (coming soon)">
    <div class="track" id="track"></div>
  </div>

<script>
  const phrase = "NEW SEASON 2027 (COMING SOON)";
  const track = document.getElementById('track');
  const make = () => {
    const s = document.createElement('span');
    s.className = 'item';
    s.setAttribute('aria-hidden','true');
    phrase.split(' ').forEach(word => {
      const w = document.createElement('span');
      w.className = 'w';
      [...word].forEach(ch => { const l = document.createElement('span'); l.className = 'l'; l.textContent = ch; w.appendChild(l); });
      s.appendChild(w);
    });
    return s;
  };
  // Build just enough copies to fill the screen twice, then set speed in px/s
  const build = () => {
    track.textContent = '';
    const probe = make(); track.appendChild(probe);
    const iw = probe.getBoundingClientRect().width || 300;
    track.textContent = '';
    const n = Math.max(2, Math.ceil(innerWidth / iw) + 1);
    const half = document.createDocumentFragment();
    for (let i = 0; i < n; i++) half.appendChild(make());
    track.appendChild(half.cloneNode(true));
    track.appendChild(half);
    const pxPerSec = innerWidth < 600 ? 38 : 52;
    track.style.setProperty('--speed', (n * iw / pxPerSec).toFixed(1) + 's');
  };
  build();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(build);
  let rw = innerWidth;
  addEventListener('resize', () => { if (Math.abs(innerWidth - rw) > 40) { rw = innerWidth; build(); } });

  const rand = (a, b) => a + Math.random() * (b - a);
  const css = getComputedStyle(document.documentElement);
  const RED = css.getPropertyValue('--red').trim();

  // ---------- Pixelate + implode ----------
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const sizeFx = () => {
    fx.width = innerWidth * DPR; fx.height = innerHeight * DPR;
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  sizeFx(); addEventListener('resize', sizeFx);

  const IN = 650, OUT = 600;          // implode / rebuild durations (ms)
  const active = new Set();
  const easeIn = x => x * x * x;
  const easeOut = x => 1 - Math.pow(1 - x, 3);

  // Turn the sentence into a grid of pixel blocks
  const pixelate = item => {
    const r = item.getBoundingClientRect();
    const cs = getComputedStyle(item);
    const fs = parseFloat(cs.fontSize);
    const block = Math.max(3, Math.round(fs / 7));
    const c = document.createElement('canvas');
    c.width = Math.ceil(r.width); c.height = Math.ceil(r.height);
    const x = c.getContext('2d');
    x.font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    x.textBaseline = 'middle'; x.fillStyle = '#fff';
    item.querySelectorAll('.l').forEach(l => {
      const lr = l.getBoundingClientRect();
      x.fillText(l.textContent, lr.left - r.left, lr.top - r.top + lr.height / 2);
    });
    const data = x.getImageData(0, 0, c.width, c.height).data;
    const px = [];
    for (let by = 0; by < c.height; by += block)
      for (let bx = 0; bx < c.width; bx += block) {
        let hit = 0;
        for (let yy = by; yy < Math.min(by + block, c.height) && !hit; yy++)
          for (let xx = bx; xx < Math.min(bx + block, c.width); xx++)
            if (data[(yy * c.width + xx) * 4 + 3] > 60) { hit = 1; break; }
        if (hit) px.push({ x: bx, y: by, d: rand(0.05, 0.4), jx: rand(-1, 1), jy: rand(-1, 1) });
      }
    return { px, block, w: c.width, h: c.height };
  };

  const implode = item => {
    if (!item._px) item._px = pixelate(item);
    item._dir = 1; item._t = performance.now() - (item._p || 0) * IN;
    item.classList.add('hide');
    active.add(item); loop();
  };
  const rebuild = item => {
    if (!active.has(item) && !item._p) return;
    item._dir = -1; item._t = performance.now() - (1 - (item._p || 0)) * OUT;
    active.add(item); loop();
  };

  let running = false;
  const loop = () => { if (!running) { running = true; requestAnimationFrame(draw); } };
  const draw = now => {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    active.forEach(item => {
      const { px, block, w, h } = item._px;
      const p = item._dir === 1
        ? Math.min((now - item._t) / IN, 1)
        : Math.max(1 - (now - item._t) / OUT, 0);
      item._p = p;
      const r = item.getBoundingClientRect();     // follows the scroll
      const cx = r.left + w / 2, cy = r.top + h / 2;

      fctx.fillStyle = RED;
      px.forEach(q => {
        // pixelate first (blocks jitter in place), then collapse to the centre
        const k = Math.min(Math.max((p - q.d) / (1 - q.d), 0), 1);
        const m = item._dir === 1 ? easeIn(k) : 1 - easeOut(1 - k);
        const sx = r.left + q.x + q.jx * block * 0.12 * Math.min(p * 4, 1);
        const sy = r.top + q.y + q.jy * block * 0.12 * Math.min(p * 4, 1);
        const s = block * (0.92 - m * 0.75);
        fctx.globalAlpha = 1 - Math.max(m - 0.85, 0) / 0.15 * 0.9;
        fctx.fillRect(sx + (cx - sx) * m, sy + (cy - sy) * m, s, s);
      });
      // collapsed core: a tight pulsing red point
      if (p > 0.75) {
        const g = (p - 0.75) / 0.25;
        const rad = block * (1.2 + Math.sin(now / 70) * 0.4) * g;
        fctx.globalAlpha = g;
        fctx.shadowColor = RED; fctx.shadowBlur = 18 * g;
        fctx.fillRect(cx - rad / 2, cy - rad / 2, rad, rad);
        fctx.shadowBlur = 0;
      }
      fctx.globalAlpha = 1;

      if (item._dir === -1 && p === 0) { item.classList.remove('hide'); active.delete(item); }
    });
    if (active.size) requestAnimationFrame(draw);
    else { running = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  };

  // Desktop: implode on hover, rebuild on leave
  track.addEventListener('mouseover', e => {
    const it = e.target.closest('.item');
    if (it) implode(it);
  });
  track.addEventListener('mouseout', e => {
    const it = e.target.closest('.item');
    if (it && !it.contains(e.relatedTarget)) rebuild(it);
  });
  // Touch: tap to implode, it rebuilds after a moment
  track.addEventListener('touchstart', e => {
    const it = e.target.closest('.item');
    if (!it) return;
    implode(it);
    clearTimeout(it._tt);
    it._tt = setTimeout(() => rebuild(it), 1500);
  }, { passive: true });

  // ---------- Side flames ----------
  (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvases = [...document.querySelectorAll('.fire')];
    const ctxs = canvases.map(c => c.getContext('2d'));
    const dpr = 0.35;                       // low-res on purpose: soft + fast
    let W = 0, H = 0, parts = [];
    const size = () => {
      const r = canvases[0].getBoundingClientRect();
      W = r.width; H = r.height;
      canvases.forEach(c => { c.width = W * dpr; c.height = H * dpr; });
      ctxs.forEach(x => x.setTransform(dpr, 0, 0, dpr, 0, 0));
    };
    size(); addEventListener('resize', size);

    // one shared particle field, drawn mirrored on both sides
    const spawn = (ember = Math.random() < 0.08) => {
      const edge = Math.pow(Math.random(), 1.6);           // denser at the outer edge
      const scale = Math.max(W / 220, 0.45);
      return {
        ember,
        x: edge * W * 0.85,
        y: H + (ember ? 0 : rand(0, 25)),
        vx: rand(-0.3, 0.4),
        vy: -(ember ? rand(4, 7) : rand(3, 6.5)) * (H / 900 + 0.25),
        r: ember ? rand(2, 4) : rand(45, 95) * scale * (1 - edge * 0.5),
        life: 0,
        max: ember ? rand(110, 190) : rand(55, 105),
        seed: Math.random() * 1000
      };
    };
    const target = () => Math.round((W > 120 ? 260 : 150) * (H / 900 + 0.35));

    let t0 = 0;
    const frame = t => {
      const dt = Math.min((t - t0) / 16.7 || 1, 3); t0 = t;
      const n = target();
      while (parts.length < n) parts.push(spawn());
      ctxs.forEach(c => { c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, W, H); c.globalCompositeOperation = 'lighter'; });

      ctxs.forEach(c => {
        const flick = 0.85 + Math.sin(t / 90) * 0.08 + Math.random() * 0.07;
        const bed = c.createLinearGradient(0, H, 0, H - H * 0.18);
        bed.addColorStop(0, `rgba(255,120,20,${0.55 * flick})`);
        bed.addColorStop(0.35, `rgba(230,40,10,${0.3 * flick})`);
        bed.addColorStop(1, 'rgba(120,0,0,0)');
        const side = c.createLinearGradient(0, 0, W, 0);
        c.fillStyle = bed; c.fillRect(0, H - H * 0.18, W * 0.9, H * 0.18);
      });

      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life += dt;
        const k = p.life / p.max;
        if (k >= 1) { parts[i] = spawn(); continue; }
        const sway = p.ember ? 1.4 : 0.9;
        p.x += (p.vx + Math.sin(t / 220 + p.seed + p.y / 90) * sway) * dt;
        p.y += p.vy * dt;
        if (p.ember) {
          const a = (1 - k) * 0.9;
          ctxs.forEach(c => { c.fillStyle = `hsla(${40 - k * 30},100%,65%,${a})`; c.fillRect(p.x, p.y, p.r, p.r); });
          continue;
        }
        const rad = p.r * (1 - k * 0.85);                 // tapers into a tongue
        const hue = 38 - k * 38, light = 52 - k * 20;     // yellow core -> orange -> red
        const a = (k < 0.03 ? 0.5 + k / 0.06 : 1 - (k - 0.03) / 0.97) * 0.17;
        ctxs.forEach(c => {
          const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
          g.addColorStop(0, `hsla(${hue},100%,${light}%,${a})`);
          g.addColorStop(0.5, `hsla(${Math.max(hue - 15, 0)},100%,${light - 15}%,${a * 0.5})`);
          g.addColorStop(1, 'hsla(0,100%,25%,0)');
          c.fillStyle = g;
          c.beginPath(); c.arc(p.x, p.y, rad, 0, Math.PI * 2); c.fill();
        });
      }
      if (!reduce) requestAnimationFrame(frame);
    };
    if (reduce) { for (let i = 0; i < 400; i++) frame(i * 16.7); } else requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
